<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepPilot — Your preparation. Your pace. Your progress.</title>
    <meta name="description" content="PrepPilot is a free study workspace for exam aspirants and self-learners. Organise your syllabus, YouTube lectures, notes and daily plan, and track real progress." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PrepPilot" />
    <meta property="og:title" content="PrepPilot — Your preparation. Your pace. Your progress." />
    <meta property="og:description" content="Organise your syllabus, YouTube lectures, notes and daily plan in one calm workspace." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PrepPilot — Your preparation. Your pace. Your progress." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PrepPilot — Your preparation. Your pace. Your progress." />
    <meta name="twitter:description" content="Organise your syllabus, YouTube lectures, notes and daily plan in one calm workspace." />
    <!-- seo:site (canonical, og:url, og:image and JSON-LD are injected at build time; see vite.config.ts) -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('preppilot-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>PrepPilot — Your preparation. Your pace. Your progress.</h1>
      <p>PrepPilot is a study workspace for exam aspirants and self-learners. Please enable JavaScript to use it.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
